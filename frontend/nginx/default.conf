# ╔══════════════════════════════════════════════════════════════════╗
# ║       SYGIM — Configuration Nginx (Reverse Proxy)               ║
# ╚══════════════════════════════════════════════════════════════════╝

server {
    listen 80;
    server_name localhost;

    # ── Fichiers statiques du frontend ────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Compression Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ── Routes API → proxy vers le backend ────────────────────────
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        # Timeout pour les rapports longs
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── SPA fallback (toutes routes → index.html) ─────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache navigateur pour assets statiques ────────────────────
    location ~* \.(css|js|png|jpg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
